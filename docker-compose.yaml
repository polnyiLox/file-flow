name: file-flow

x-app: &app
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  file-db:
    image: postgres:17
    environment:
      POSTGRES_USER: file
      POSTGRES_PASSWORD: file
      POSTGRES_DB: file
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U file -d file"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management
    environment:
      RABBITMQ_DEFAULT_USER: file
      RABBITMQ_DEFAULT_PASS: file
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: analytics
      MONGO_INITDB_ROOT_PASSWORD: analytics
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: ./file-service
    env_file: ./file-service/.env.example
    environment:
      APP_CONFIG__DB__HOST: file-db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      file-db:
        condition: service_healthy

  file-service:
    <<: *app
    build: ./file-service
    env_file: ./file-service/.env.example
    environment:
      APP_CONFIG__DB__HOST: file-db
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__S3__ENDPOINT_URL: http://minio:9000
      APP_CONFIG__S3__PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      APP_CONFIG__KAFKA__BOOTSTRAP_SERVERS: '["kafka:9092"]'
      APP_CONFIG__RABBITMQ_CONNECTION__HOST: rabbitmq
      APP_CONFIG__RABBITMQ_CONNECTION__USER: file
      APP_CONFIG__RABBITMQ_CONNECTION__PASSWORD: file
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy

  processor-service:
    <<: *app
    build: ./process-service
    environment:
      APP_CONFIG__FILE_SERVICE_URL: http://file-service:8000
      APP_CONFIG__RABBITMQ__URL: amqp://file:file@rabbitmq:5672/
      APP_CONFIG__KAFKA__BOOTSTRAP_SERVERS: '["kafka:9092"]'
      APP_CONFIG__S3__ENDPOINT_URL: http://minio:9000
    depends_on:
      file-service:
        condition: service_healthy

  analytics-service:
    <<: *app
    build: ./analytics-service
    environment:
      APP_CONFIG__MONGODB__HOST: mongodb
      APP_CONFIG__KAFKA__BOOTSTRAP_SERVERS: '["kafka:9092"]'
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    <<: *app
    build: ./api-gateway
    environment:
      APP_CONFIG__FILE_SERVICE_URL: http://file-service:8000
      APP_CONFIG__ANALYTICS_SERVICE_URL: http://analytics-service:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      file-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infrastructure/loki/config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

  alloy:
    image: grafana/alloy:v1.5.1
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  rabbitmq_data:
  kafka_data:
  minio_data:
  mongodb_data:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

services:

  api:
    build: .
    env_file:
      - .env

    ports:
      - "${APP_CONFIG__API__PORT}:${APP_CONFIG__API__PORT}"

    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:17

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data:
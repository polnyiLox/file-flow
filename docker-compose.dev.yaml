services:

  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev

    env_file:
      - .env

    command:
      - uv
      - run
      - alembic
      - upgrade
      - head

    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    depends_on:
      postgres:
        condition: service_healthy


  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini

    depends_on:
      migrate:
        condition: service_completed_successfully


volumes:
  postgres_dev_data:
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: file-flow
    static_configs:
      - targets: ["file-service:8000"]
        labels:
          service: file-service
      - targets: ["processor-service:8000"]
        labels:
          service: processor-service
      - targets: ["analytics-service:8000"]
        labels:
          service: analytics-service
      - targets: ["api-gateway:8000"]
        labels:
          service: api-gateway

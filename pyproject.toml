[project]
name = "api-gateway"
version = "0.1.0"
description = "FileFlow HTTP gateway"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "prometheus-client>=0.22",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]
